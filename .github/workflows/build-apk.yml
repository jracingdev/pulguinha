name: Build APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build APK release
        run: |
          ARGS=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Secrets GitHub detectados — usando dart-define no build."
            ARGS="--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          else
            echo "Sem secrets — APK usará credenciais embutidas em lib/config/supabase_config.dart."
          fi
          flutter build apk --release $ARGS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulguinha-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
