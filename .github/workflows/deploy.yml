name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar secrets Supabase
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Sem secrets GitHub — build web usará credenciais embutidas em lib/config/supabase_config.dart."
          else
            echo "Secrets Supabase detectados — build web conectará ao banco via dart-define."
          fi

      - name: Build web
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN || 'funcionaldopulguinha.com.br' }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/pulguinha/"
          fi
          BUILD_ARGS=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            BUILD_ARGS="--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "Build com secrets Supabase (dart-define)."
          else
            echo "Build com credenciais embutidas em lib/config/supabase_config.dart."
          fi
          echo "Build com base-href: $BASE_HREF (domínio: ${CUSTOM_DOMAIN:-nenhum})"
          flutter build web --release \
            --base-href "$BASE_HREF" \
            $BUILD_ARGS

      - name: Preparar artefato Pages
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN || 'funcionaldopulguinha.com.br' }}
        run: |
          # Impede o Jekyll de processar o artefato (senão some arquivos _* do Flutter).
          touch build/web/.nojekyll
          # SPA fallback: rotas profundas caem no index do Flutter.
          cp build/web/index.html build/web/404.html
          mkdir -p build/web/privacidade build/web/termos
          cp docs/privacidade/index.html build/web/privacidade/
          cp docs/termos/index.html build/web/termos/
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "$CUSTOM_DOMAIN" > build/web/CNAME
          fi
          # Guardas: falhar o job se o artefato não for o app Flutter web.
          test -f build/web/flutter_bootstrap.js || test -f build/web/flutter.js
          test -f build/web/main.dart.js
          test -f build/web/reset-password/index.html
          test -f build/web/.nojekyll
          test -f build/web/CNAME
          echo "Artefato Pages OK (Flutter + .nojekyll + CNAME + /reset-password)."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
